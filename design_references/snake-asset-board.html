<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake — Asset Board</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@700;800&display=swap');

  :root {
    --bg:       #0d1117;
    --surface:  #161b22;
    --border:   #21262d;
    --navy:     #1a1a2e;
    --green:    #4ade80;
    --green2:   #22c55e;
    --gold:     #fbbf24;
    --red:      #f87171;
    --blue:     #38bdf8;
    --purple:   #c084fc;
    --muted:    #6e7681;
    --text:     #e6edf3;
    --text2:    #8b949e;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    padding: 40px 32px 60px;
  }

  /* ── Header ── */
  .page-header {
    display: flex;
    align-items: baseline;
    gap: 20px;
    margin-bottom: 40px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 20px;
  }
  .page-title {
    font-family: 'Syne', sans-serif;
    font-size: 28px;
    font-weight: 800;
    color: var(--green);
    letter-spacing: -0.5px;
  }
  .page-meta { font-size: 11px; color: var(--muted); letter-spacing: 1px; }

  /* ── Section ── */
  .section { margin-bottom: 48px; }
  .section-label {
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .section-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* ── Asset Grid ── */
  .asset-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
  }

  /* ── Asset Card ── */
  .asset-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px 16px 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    width: 140px;
    position: relative;
    transition: border-color 0.2s, box-shadow 0.2s;
    cursor: pointer;
  }
  .asset-card:hover {
    border-color: rgba(74,222,128,0.4);
    box-shadow: 0 0 20px rgba(74,222,128,0.08);
  }
  .asset-card:hover .copy-hint { opacity: 1; }

  .copy-hint {
    position: absolute;
    top: 8px; right: 8px;
    font-size: 9px;
    color: var(--muted);
    opacity: 0;
    transition: opacity 0.2s;
    letter-spacing: 0.5px;
  }

  .asset-canvas {
    width: 80px;
    height: 80px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .asset-canvas svg { overflow: visible; }

  .asset-name {
    font-size: 10px;
    font-weight: 500;
    color: var(--text2);
    text-align: center;
    letter-spacing: 0.5px;
  }

  .asset-size {
    font-size: 9px;
    color: var(--muted);
    text-align: center;
  }

  /* ── Color palette row ── */
  .palette-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 24px;
  }
  .swatch {
    display: flex;
    flex-direction: column;
    gap: 6px;
    align-items: center;
  }
  .swatch-dot {
    width: 36px; height: 36px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.06);
  }
  .swatch-hex { font-size: 9px; color: var(--muted); letter-spacing: 0.5px; }

  /* ── UI component previews ── */
  .ui-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px 18px 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    width: 180px;
    cursor: pointer;
    transition: border-color 0.2s;
  }
  .ui-card:hover { border-color: rgba(74,222,128,0.4); }
  .ui-name { font-size: 10px; color: var(--muted); letter-spacing: 0.5px; }

  /* ── Toast ── */
  .toast {
    position: fixed;
    bottom: 28px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #1f2937;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 20px;
    font-size: 12px;
    color: var(--green);
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ── Export bar ── */
  .export-bar {
    display: flex;
    gap: 10px;
    margin-bottom: 32px;
    flex-wrap: wrap;
  }
  .exp-btn {
    padding: 7px 16px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text2);
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.5px;
  }
  .exp-btn:hover { border-color: var(--green); color: var(--green); }
  .exp-btn.primary { background: var(--green); color: #0d1117; border-color: var(--green); font-weight: 500; }
  .exp-btn.primary:hover { background: var(--green2); }

  /* checkerboard bg for transparent assets */
  .checker {
    background-image:
      linear-gradient(45deg, #1e2430 25%, transparent 25%),
      linear-gradient(-45deg, #1e2430 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #1e2430 75%),
      linear-gradient(-45deg, transparent 75%, #1e2430 75%);
    background-size: 10px 10px;
    background-position: 0 0, 0 5px, 5px -5px, -5px 0px;
    border-radius: 8px;
  }
</style>
</head>

// ════════════════════════════════════════════
//  RENDER
// ════════════════════════════════════════════
function init() {
  renderPalette();
  renderSprites();
  renderTiles();
  renderUI();
}

function renderPalette() {
  const row = document.getElementById('palette-row');
  PALETTE.forEach(p => {
    row.innerHTML += `
      <div class="swatch" onclick="copyText('${p.hex}','${p.name} copied!')">
        <div class="swatch-dot" style="background:${p.hex}" title="${p.name}"></div>
        <div class="swatch-hex">${p.hex}</div>
      </div>`;
  });
}

function renderSprites() {
  const grid = document.getElementById('sprite-grid');
  SPRITES.forEach(s => {
    const card = document.createElement('div');
    card.className = 'asset-card checker';
    card.title = `Click to download ${s.name} SVG`;
    card.innerHTML = `
      <span class="copy-hint">↓ SVG</span>
      <div class="asset-canvas">${s.svg}</div>
      <div class="asset-name">${s.name}</div>
      <div class="asset-size">${s.size} px</div>`;
    card.onclick = () => downloadSVG(s.svg, s.id);
    grid.appendChild(card);
  });
}

function renderTiles() {
  const grid = document.getElementById('tile-grid');
  // Show tiles 4× scaled
  TILES.forEach(t => {
    const card = document.createElement('div');
    card.className = 'asset-card';
    card.title = `Click to download ${t.name} SVG`;
    card.innerHTML = `
      <span class="copy-hint">↓ SVG</span>
      <div class="asset-canvas">${t.svg}</div>
      <div class="asset-name">${t.name}</div>
      <div class="asset-size">${t.size} px</div>`;
    card.onclick = () => downloadSVG(t.svg, t.id);
    grid.appendChild(card);
  });
}

function renderUI() {
  const grid = document.getElementById('ui-grid');
  UI_COMPONENTS.forEach(c => {
    const card = document.createElement('div');
    card.className = 'asset-card';
    card.style.width = Math.max(180, c.w + 32) + 'px';
    card.title = `Click to download ${c.name} SVG`;
    card.innerHTML = `
      <span class="copy-hint">↓ SVG</span>
      <div class="asset-canvas" style="width:${c.w}px;height:${c.h}px">${c.html}</div>
      <div class="asset-name">${c.name}</div>
      <div class="asset-size">${c.w}×${c.h} px</div>`;
    card.onclick = () => downloadSVG(c.html, c.id);
    grid.appendChild(card);
  });
}

// ════════════════════════════════════════════
//  EXPORT
// ════════════════════════════════════════════
function downloadSVG(svgStr, filename) {
  const blob = new Blob([svgStr], { type: 'image/svg+xml' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${filename}.svg`;
  a.click();
  toast(`Downloaded ${filename}.svg`);
}

function svgToCanvas(svgStr, w, h) {
  return new Promise(resolve => {
    const img = new Image();
    const scale = 2; // 2× for retina
    const canvas = document.createElement('canvas');
    canvas.width = w * scale;
    canvas.height = h * scale;
    const ctx = canvas.getContext('2d');
    ctx.scale(scale, scale);
    const blob = new Blob([svgStr], { type: 'image/svg+xml' });
    const url = URL.createObjectURL(blob);
    img.onload = () => { ctx.drawImage(img, 0, 0, w, h); URL.revokeObjectURL(url); resolve(canvas); };
    img.onerror = () => { resolve(null); };
    img.src = url;
  });
}

async function exportAllSVG() {
  const all = [...SPRITES, ...TILES, ...UI_COMPONENTS.map(c => ({...c, svg: c.html}))];
  // Build a combined SVG sprite sheet
  const combined = buildSpriteSheet(all);
  downloadSVG(combined, 'snake-assets-spritesheet');
  toast('Exported SVG sprite sheet!');
}

function buildSpriteSheet(assets) {
  const cols = 6;
  const cellW = 100, cellH = 120, padding = 16;
  const rows = Math.ceil(assets.length / cols);
  const W = cols * (cellW + padding) + padding;
  const H = rows * (cellH + padding) + padding + 40;

  let defs = `<defs>
    <style>text{font-family:'DM Mono',monospace;}</style>
  </defs>`;

  let items = '';
  assets.forEach((a, i) => {
    const col = i % cols;
    const row = Math.floor(i / cols);
    const x = padding + col * (cellW + padding);
    const y = 40 + padding + row * (cellH + padding);
    const svgSrc = a.svg || a.html || '';
    items += `<g transform="translate(${x},${y})">
      ${svgSrc}
      <text x="${cellW/2}" y="${cellH + 14}" text-anchor="middle" font-size="9" fill="#6e7681">${a.id}</text>
    </g>`;
  });

  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">
    <rect width="${W}" height="${H}" fill="#0d1117"/>
    ${defs}
    <text x="${padding}" y="26" font-size="14" font-weight="700" fill="#4ade80" font-family="'DM Mono',monospace">🐍 Snake — Asset Sprite Sheet</text>
    ${items}
  </svg>`;
}

async function exportAllPNG() {
  toast('Exporting PNGs... (one moment)');
  const all = [...SPRITES, ...TILES, ...UI_COMPONENTS.map(c => ({...c, svg: c.html}))];
  for (const asset of all) {
    const svgStr = asset.svg || asset.html || '';
    // Parse width/height from SVG
    const tmp = document.createElement('div');
    tmp.innerHTML = svgStr;
    const svgEl = tmp.querySelector('svg');
    const w = parseInt(svgEl?.getAttribute('width') || '64');
    const h = parseInt(svgEl?.getAttribute('height') || '64');
    const canvas = await svgToCanvas(svgStr, w, h);
    if (!canvas) continue;
    const a = document.createElement('a');
    a.href = canvas.toDataURL('image/png');
    a.download = `${asset.id}.png`;
    a.click();
    await new Promise(r => setTimeout(r, 80));
  }
  toast('All PNGs exported!');
}

function copySVGSprite() {
  const all = [...SPRITES, ...TILES, ...UI_COMPONENTS.map(c => ({...c, svg: c.html}))];
  const sprite = buildSpriteSheet(all);
  navigator.clipboard.writeText(sprite).then(() => toast('SVG sprite copied to clipboard!'));
}

function copyText(text, msg) {
  navigator.clipboard.writeText(text).then(() => toast(msg || `Copied: ${text}`));
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2200);
}

init();
</script>
